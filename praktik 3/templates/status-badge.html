<template id="tpl-status">

<span>
    <span
        v-if="qty === 0"
        class="status-kosong">
        ❌ Kosong
    </span>

    <span
        v-else-if="qty < safety"
        class="status-menipis">
        ⚠ Menipis
    </span>

    <span
        v-else
        class="status-aman">
        ✅ Aman
    </span>
</span>

</template>
